services:
  - type: web
    name: hapsaydalan
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/cloud/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: EVIDENCE_S3_ACCESS_KEY_ID
        sync: false
      - key: EVIDENCE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: EVIDENCE_S3_BUCKET
        value: evidence
      - key: EVIDENCE_S3_ENDPOINT_URL
        sync: false
      - key: EVIDENCE_S3_REGION
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: OPENROUTESERVICE_API_KEY
        sync: false
